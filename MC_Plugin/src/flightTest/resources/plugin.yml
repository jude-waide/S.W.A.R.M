name: DroneFlightTests
version: '1.0'
main: me.jetcobblestone.test.FlightTestPlugin
api-version: '1.21'
depend: [DroneSim]
commands:
  test_drone_speed:
    usage: /test_drone_speed <speed> <x> <y> <z> [queued]
    permission: dronesim.flight-tests
  test_mission_setup:
    usage: /test_mission_setup
    permission: dronesim.flight-tests
  test_drone_flight:
    usage: /test_drone_flight <up|down|horizontal|blocked|ceiling|queued-blocked|turn> <x> <y> <z>
    permission: dronesim.flight-tests
permissions:
  dronesim.flight-tests:
    default: op
